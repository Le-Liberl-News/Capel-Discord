<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrivée Mechapom</title>
<!-- The Mechapom fortress's arrival, rendered into assets/highlights/mechapom-arrival.gif (sent with its Discord
     announcement): it falls from the sky on Sanktheim's forest road, crashes on its belly, rises on its spider legs,
     then the camera turns around it under its name. Serve the repository's root and open
     /prototypes/sanktheim/tools/mechapom-arrival.html; « Rendre le GIF » plays it frame by frame and saves it. -->
<style>
 html,body{margin:0;background:#1d1a22;color:#eee;font:14px system-ui,sans-serif}
 #bar{padding:8px 12px;display:flex;gap:8px;align-items:center}
 button{background:#3b3340;color:#fff;border:1px solid #6b5c70;border-radius:4px;padding:4px 10px;cursor:pointer}
 canvas{display:block;margin:0 12px;image-rendering:pixelated;width:960px;max-width:calc(100% - 24px)}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="bar"><button id="render">Rendre le GIF</button><span id="status">Chargement…</span></div>
<canvas id="out" width="480" height="300"></canvas>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {GIFEncoder,quantize,applyPalette} from 'https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js';
import {createPomFortress,TEXTURES} from '../pom-fortress-model.mjs';
import {loadNativeProp} from '../native-prop.mjs';
const W=480,H=300,FRAMES=84,DELAY=70,S=2/3,AT=new T.Vector3(-150*S,0,0);
const status=document.getElementById('status'),out=document.getElementById('out'),ctx=out.getContext('2d');
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color(0x5d6b80);scene.fog=new T.Fog(0x5d6b80,60,190);
scene.add(new T.HemisphereLight(0xffe8d0,0x4a4438,1.3));const sun=new T.DirectionalLight(0xffe2c0,2.6);sun.position.set(-40,70,50);scene.add(sun);
const asset=p=>'../../../activity'+p.replace(/^\/assets\/siege\//,'/assets/sky/sanktheim/props/');
const terrain=(await new GLTFLoader().loadAsync('../../../activity/assets/sky/sanktheim/forest/terrain.gltf')).scene;
terrain.scale.setScalar(S);terrain.traverse(o=>{for(const m of [].concat(o.material??[]))m.side=T.DoubleSide;});scene.add(terrain);scene.updateMatrixWorld(true);
// the ground under the fortress
const probe=new T.Raycaster(new T.Vector3(AT.x,80,AT.z),new T.Vector3(0,-1,0));AT.y=probe.intersectObject(terrain,true)[0]?.point.y??0;
const loader=new T.TextureLoader(),textures={};
await Promise.all([...TEXTURES.map(async n=>{textures[n]=await loader.loadAsync(asset(`/assets/siege/pom-fortress/${n}.png`));}),loader.loadAsync(asset('/assets/sky/effects/fire-frames.png')).then(m=>{m.colorSpace=T.SRGBColorSpace;textures.fire=m;})]);
const missile=await loadNativeProp(T,asset,'missile',.4).catch(()=>null);
const fortress=createPomFortress(T,{textures,missile,autoFire:false});fortress.root.scale.setScalar(S);scene.add(fortress.root,fortress.effects);
// the impact: the game's fire, bursting around it, then smouldering
const burst=[];
for(let i=0;i<16;i++){const map=textures.fire.clone();map.repeat.set(.25,1);const sprite=new T.Sprite(new T.SpriteMaterial({map,transparent:true,depthWrite:false,blending:T.AdditiveBlending}));sprite.visible=false;scene.add(sprite);burst.push({sprite,angle:i/16*Math.PI*2,reach:6+(i%3)*2.5});}
await document.fonts.load('64px Cinzel');
const camera=new T.PerspectiveCamera(42,W/H,.1,600);
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
// frame f: where everything is
function pose(f){
 const t=f*DELAY/1000,fall=ease(f/14),lying=f>=14&&f<24,rise=ease((f-24)/18);
 let y;if(f<14)y=(1-(f/14)**2)*90-8*S*(f/14)**2;else y=-8*S*(1-rise);
 fortress.root.position.set(AT.x,AT.y+y,AT.z);fortress.root.rotation.set(0,Math.PI/2,f<14?.2*(1-f/14):0);   // it faces the walls (+X)
 fortress.animate(t,{walking:false,burning:f>=30,stance:f<24?0:rise,ground:-y/S,target:null});
 // the camera: low, watching it fall; a shake at the crash; then round it
 const centre=new T.Vector3(AT.x,AT.y+9*S,AT.z);
 if(f<42){const k=Math.min(1,f/14);camera.position.set(AT.x+34,AT.y+4+(1-k)*2,AT.z+26);camera.lookAt(centre.x,AT.y+y+9*S*.6+ (1-k)*10,centre.z);
  if(f>=14&&f<22){const s=(22-f)/8;camera.position.x+=Math.sin(f*2.7)*s*1.2;camera.position.y+=Math.cos(f*3.3)*s*.9;}}
 else{const a=Math.atan2(26,34)+(f-42)/(FRAMES-42)*Math.PI*1.25,r=40-(f-42)*.1;camera.position.set(AT.x+Math.cos(a)*r,AT.y+9+(f-42)*.12,AT.z+Math.sin(a)*r);camera.lookAt(centre);}
 for(const b of burst){const age=(f-14)/12;b.sprite.visible=f>=14;if(!b.sprite.visible)continue;const k=Math.min(1,age);
  b.sprite.position.set(AT.x+Math.cos(b.angle)*b.reach*(.4+k),AT.y+1+k*2,AT.z+Math.sin(b.angle)*b.reach*(.4+k));
  b.sprite.scale.setScalar(f<26?3+k*5:8-Math.min(4,(f-26)*.25));b.sprite.material.opacity=f<26?1:Math.max(0,1-(f-26)/16);b.sprite.material.map.offset.x=(f+b.angle*3|0)%4*.25;}
}
// the name, over the turn round it
function title(f){
 const k=ease((f-46)/10);if(k<=0)return;
 ctx.save();ctx.globalAlpha=k;ctx.textAlign='center';ctx.textBaseline='middle';
 const y=H-62+(1-k)*20;
 ctx.fillStyle='rgba(20,8,6,.55)';ctx.fillRect(0,y-24,W,62);
 ctx.font='bold 29px Cinzel';ctx.lineWidth=6;ctx.strokeStyle='#2a0c06';ctx.strokeText('FORTERESSE MECHAPOM',W/2,y+10);
 const g=ctx.createLinearGradient(0,y-10,0,y+30);g.addColorStop(0,'#ffe7a8');g.addColorStop(.55,'#ff8a2a');g.addColorStop(1,'#c2361a');ctx.fillStyle=g;ctx.fillText('FORTERESSE MECHAPOM',W/2,y+10);
 ctx.restore();
}
function draw(f){pose(f);renderer.render(scene,camera);ctx.drawImage(renderer.domElement,0,0);title(f);}
let preview=0;const loop=()=>{if(!rendering){draw(preview);preview=(preview+1)%FRAMES;}setTimeout(loop,DELAY);};let rendering=false;loop();
status.textContent='Prêt';
document.getElementById('render').onclick=async()=>{
 rendering=true;const gif=GIFEncoder();
 for(let f=0;f<FRAMES;f++){draw(f);const data=ctx.getImageData(0,0,W,H).data,palette=quantize(data,256),index=applyPalette(data,palette);gif.writeFrame(index,W,H,{palette,delay:f===FRAMES-1?2500:DELAY,repeat:0});status.textContent=`Image ${f+1}/${FRAMES}`;await new Promise(r=>setTimeout(r));}
 gif.finish();const blob=new Blob([gif.bytes()],{type:'image/gif'});window.lastGif=blob;
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mechapom-arrival.gif';a.click();
 status.textContent=`GIF prêt (${Math.round(blob.size/1024)} Ko)`;rendering=false;
};
window.draw=draw;
</script>
</body>
</html>
