<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Carte entière</title>
<!-- The whole Sanktheim map seen from above, for the wave recap (fortress-report.cjs): assets/overview/full-map.png
     and its bounds in the siege's units (full-map.json). Serve the repository's root, open this page, then call
     bake() in the console: it returns the picture and the bounds (or posts them to /__shot when that exists). -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body style="margin:0;background:#222">
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const W=1280,loader=new GLTFLoader(),scene=new T.Scene();scene.add(new T.AmbientLight(0xffffff,3));
for(const name of ['terrain','trees']){const model=(await loader.loadAsync(`/activity/assets/sky/sanktheim/forest/${name}.gltf`)).scene;scene.add(model);}
const box=new T.Box3().setFromObject(scene.children.find(o=>o.isGroup||o.type==='Group')??scene),H=Math.round(W*(box.max.z-box.min.z)/(box.max.x-box.min.x));
const camera=new T.OrthographicCamera(box.min.x,box.max.x,-box.min.z,-box.max.z,.1,1000);camera.position.set(0,box.max.y+50,0);camera.up.set(0,0,-1);camera.lookAt(0,0,0);
const renderer=new T.WebGLRenderer({preserveDrawingBuffer:true,antialias:true});renderer.setSize(W,H);renderer.outputColorSpace=T.SRGBColorSpace;document.body.append(renderer.domElement);
renderer.render(scene,camera);
// top of the picture: the smallest z; left: the smallest x
window.bake=async()=>{const bounds={width:W,height:H,minX:box.min.x,maxX:box.max.x,minZ:box.min.z,maxZ:box.max.z};const blob=await new Promise(r=>renderer.domElement.toBlob(r,'image/png'));
 try{await fetch('/__shot?name=full-map.png',{method:'POST',body:blob});await fetch('/__shot?name=full-map.json',{method:'POST',body:JSON.stringify(bounds)});}catch{}return bounds;};
window.ready=true;
</script></body></html>
