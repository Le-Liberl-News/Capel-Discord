<style>
body{margin:0;color:#f0eadf;background:#17232d;font:13px system-ui}canvas{display:block}#ui,#sky-combat{display:none!important}body:not([data-sky-touch]) #sky-jump{display:none!important}
#hud,#siege-journal,#siege-settings{position:fixed;z-index:24;background:#16232ce8;border:1px solid #8f8366;border-radius:6px;color:#f0e4c8;box-sizing:border-box;font:13px system-ui}
body.siege-mode #hud{display:block!important;top:12px;left:12px;width:250px;max-width:calc(100vw - 80px);padding:0}
summary{cursor:pointer;padding:8px 11px;user-select:none}summary::marker{color:#d6bb80}#hud summary{font-weight:600}#siege-phase{float:right;font-weight:400;font-size:12px;color:#d7c099}
#siege-panel-body{padding:0 9px 8px}#clock{font-size:11px;color:#d1c7b1;margin:1px 0 6px}#walls button{display:block;width:100%;margin:4px 0;padding:6px 8px;text-align:left;background:#263941;border:1px solid #6d7975;color:#f0e4c8;border-radius:4px;font:12px system-ui}
#siege-journal{right:12px;bottom:var(--siege-log-bottom,75px);max-width:calc(100vw - 24px)}#siege-journal:not([open]){width:auto}#siege-journal[open]{width:300px}#log{max-height:min(180px,30vh);overflow:auto;padding:0 11px 7px;font-size:11px}#log p{white-space:pre-line;line-height:1.35;margin:8px 0}#log:empty{display:none}
#siege-settings{right:12px;top:12px}#siege-settings summary{font-size:19px;line-height:1;padding:6px 9px;list-style:none}#siege-settings label{display:block;padding:6px 12px 11px;white-space:nowrap}
#message{position:fixed;left:50%;top:12px;transform:translateX(-50%);padding:7px 12px;background:#342215e8;color:#ffd59a;border-radius:5px;z-index:32;max-width:70vw}#message:empty{display:none}
#wave-banner{position:fixed;top:23%;left:0;width:100%;text-align:center;pointer-events:none;z-index:20;font:900 clamp(26px,5vw,60px) system-ui;color:#fff0be;text-shadow:0 4px 6px #000,0 0 24px #b64416;opacity:0;transform:translateY(-15px);transition:opacity .3s,transform .3s}#wave-banner.visible{opacity:1;transform:translateY(0)}
</style>
<div id="wave-banner" role="status" aria-live="assertive"></div>
<details id="hud"><summary>Remparts <span id="siege-phase"></span></summary><section id="siege-panel-body"><p id="clock"></p><div id="walls"></div></section></details>
<details id="siege-journal"><summary>Journal</summary><div id="log" role="log" aria-label="Journal du siège"></div></details>
<details id="siege-settings"><summary aria-label="Réglages" title="Réglages">⚙</summary></details><p id="message" role="status"></p>
<div hidden id="siege-internal"><span id="counter"></span><span id="health"></span><span id="mode"></span><button hidden id="reset"></button><button hidden id="test-side"></button><button hidden id="wave"></button><button hidden id="damage"></button><button hidden id="stop"></button></div>
<canvas id="scene"></canvas>
