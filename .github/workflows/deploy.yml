name: 🚀 Deploy LN-Bot
on:
  push:
    branches:
      - main

jobs:
  deploy-and-restart:
    name: 🚚 Sync & 🔄 Restart
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Get latest code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install activity test dependencies
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Test activity movement and sessions
      run: node --test tests/activity-joshua.test.js tests/activity.test.mjs tests/activity-service.test.js tests/activity-world.test.js tests/activity-dialogue.test.mjs tests/activity-deployment.test.cjs tests/activity-projectile.test.mjs tests/activity-duel.test.js tests/application-commands.test.js tests/activity-network.test.mjs tests/activity-combat.test.js tests/activity-day-night.test.mjs tests/activity-flight.test.js tests/activity-airship.test.cjs

    - name: Test native texture transparency
      run: |
        python -m pip install --quiet pillow
        python tests/test_activity_textures.py

    - name: 🛠️ Deploy & Restart natively
      env:
        VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        VPS_USER: ${{ secrets.VPS_USERNAME }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_PORT: ${{ secrets.VPS_PORT }}
        TARGET_DIR: "/home/twnkek290001/LN-Bot"
      run: |
        set -euo pipefail
        sudo apt-get install -y sshpass

        SSH_CONTROL_PATH="$RUNNER_TEMP/capel-ssh-%C"
        SSH_TARGET="$VPS_USER@$VPS_HOST"
        sshpass -p "$VPS_PASS" ssh \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o ControlMaster=yes \
          -o ControlPersist=600 \
          -o ControlPath="$SSH_CONTROL_PATH" \
          -p "$VPS_PORT" -Nf "$SSH_TARGET"
        cleanup_ssh() {
          ssh -o ControlPath="$SSH_CONTROL_PATH" -p "$VPS_PORT" \
            -O exit "$SSH_TARGET" >/dev/null 2>&1 || true
        }
        trap cleanup_ssh EXIT
        
        echo "🚀 Début du transfert des fichiers..."
        sshpass -d 3 rsync -avz \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='.env' \
          --exclude='credentials.json' \
          --exclude='node_modules/' \
          --exclude='uploads/' \
          -e "ssh -o StrictHostKeyChecking=yes -o ControlMaster=no -o ControlPath=$SSH_CONTROL_PATH -p $VPS_PORT" \
          ./ "$SSH_TARGET:$TARGET_DIR/" 3<<<"$VPS_PASS"
        
        echo "🔄 Redémarrage du bot avec le moteur Orbal..."
        sshpass -d 3 ssh \
          -o StrictHostKeyChecking=yes \
          -o ControlMaster=no \
          -o ControlPath="$SSH_CONTROL_PATH" \
          -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 3<<<"$VPS_PASS" << 'EOF'
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          cd /home/twnkek290001/LN-Bot
          npm install --omit=dev --no-audit --no-fund
          node tools/sync-application-commands.cjs
          chmod +x maj.sh
          ./maj.sh
        EOF
        
        echo "✅ Déploiement terminé avec succès !"
