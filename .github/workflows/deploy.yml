name: 🚀 Deploy LN-Bot
on:
  push:
    branches:
      - main

# one deployment at a time: a push made while another one waits for a wave's end is deployed after it
concurrency:
  group: deploy-ln-bot
  cancel-in-progress: false

jobs:
  deploy-and-restart:
    name: 🚚 Sync & 🔄 Restart
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Get latest code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Validate startup sources
      run: |
        node --check index.js
        node --test tests/runtime-diagnostics.test.cjs
        python3 -m unittest discover -s tools/diagnostics -p "test_*.py"
        node -e 'JSON.parse(require("node:fs").readFileSync("rpg/data/aventure.json","utf8"));'

    - name: Install activity test dependencies
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Test activity movement and sessions
      run: |
        npm run activity:test
        node --test tests/rhumertume.test.cjs tests/rhumertume-policy.test.cjs
        node --test tests/media-render.test.cjs tests/adventure.test.cjs tests/still-media.test.cjs
        node tools/check-adventure-media.cjs
        node tools/check-sanktheim-media.cjs
        node --test prototypes/sanktheim/*.test.cjs prototypes/sanktheim/*.test.mjs
        node --test tests/activity-service.test.js tests/activity-world.test.js tests/activity-duel.test.js tests/activity-access.test.js

    - name: Prepare private scene browser libraries
      run: python3 tools/prepare-sanktheim-browser-libs.py

    - name: Test full Sanktheim scene recording
      run: node tools/check-sanktheim-scene.cjs

    - name: Test native texture transparency
      run: |
        python -m pip install --quiet pillow
        python tests/test_activity_textures.py

    # a restart during a Sanktheim wave throws its players out: wait for the wave's end, and keep clear of the next
    # one's start (the restart takes a minute or two); after 45 minutes the deployment goes ahead anyway
    - name: ⏳ Wait for the end of a Sanktheim wave
      run: |
        node -e '
        const MARGIN=4*60000,LIMIT=Date.now()+45*60000;
        (async()=>{for(;;){
         let s=null;try{const r=await fetch("https://leliberlnews.fr/activite/api.php?r=siege/status",{signal:AbortSignal.timeout(10000)});s=await r.json();}catch(e){console.log("Statut du siège illisible ("+e.message+") : déploiement.");return;}
         const soon=s.nextWave&&s.nextWave-s.serverTime<MARGIN;
         if(!s.wave&&!soon){console.log("Pas de vague en cours : déploiement.");return;}
         if(Date.now()>LIMIT){console.log("Toujours une vague après 45 min : déploiement quand même.");return;}
         console.log(s.wave?"Vague "+s.wave.number+" en cours, fin à "+new Date(s.wave.ends).toISOString():"Vague imminente à "+new Date(s.nextWave).toISOString()+" : attente.");
         await new Promise(r=>setTimeout(r,30000));
        }})();'

    - name: 🛠️ Deploy & Restart natively
      env:
        VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        VPS_USER: ${{ secrets.VPS_USERNAME }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_PORT: ${{ secrets.VPS_PORT }}
        TARGET_DIR: "/home/twnkek290001/LN-Bot"
      run: |
        set -euo pipefail
        sudo apt-get install -y sshpass

        # One connection only: since 26 October the host lets a runner's first SSH connection through but times
        # out the next ones (the shared master, then rsync, failed three deploys in a row). The host fetches this
        # very commit from GitHub itself (the repository is public), lays it over the bot's folder as rsync did
        # (nothing outside the repository is touched: .env, credentials.json, uploads, node_modules), then
        # restarts the bot. A connection refused or timed out is tried again, a minute later, three times.
        echo "🚀 Déploiement de $GITHUB_SHA..."
        for attempt in 1 2 3; do
          status=0
          sshpass -d 3 ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$GITHUB_REPOSITORY' '$GITHUB_SHA' '$TARGET_DIR'" 3<<<"$VPS_PASS" << 'EOF' || status=$?
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          mkdir -p "$3" && cd "$3"
          echo "📦 Récupération du code..."
          { curl -fsSL --retry 3 "https://codeload.github.com/$1/tar.gz/$2" 2>/dev/null || wget -qO- "https://codeload.github.com/$1/tar.gz/$2"; } | tar xz --strip-components=1 \
            --exclude='*/.github' --exclude='*/activity/assets/sky/liberl'
          # Independent, bounded /proc recorder survives LN-Bot restarts and Discord/SQL outages.
          if pm2 describe LN-Watch >/dev/null 2>&1; then
            pm2 restart LN-Watch
          else
            pm2 start tools/diagnostics/watch.py --name LN-Watch --interpreter python3 --max-memory-restart 64M --restart-delay 5000
          fi
          pm2 save
          npm install --omit=dev --no-audit --no-fund
          # Browser capture is validated on the CI runner, not on the shared
          # production host: running a second Chromium there can starve the bot.
          node tools/prune-retired-files.cjs
          node tools/sync-application-commands.cjs
          echo "🔄 Redémarrage du bot avec le moteur Orbal..."
          if pm2 describe LN-Bot >/dev/null 2>&1; then
            pm2 reload LN-Bot --update-env
          else
            pm2 start index.js --name LN-Bot --cwd "$PWD"
          fi
          pm2 save
          node -e 'const {execFileSync}=require("node:child_process");const apps=JSON.parse(execFileSync("pm2",["jlist"],{encoding:"utf8"}));if(!apps.some(p=>p.name==="LN-Bot"&&p.pm2_env.status==="online"))process.exit(1);'
          node -e '(async()=>{let stable=0;for(let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:3000/api/siege/status",{signal:AbortSignal.timeout(3000)}),s=await r.json();if(r.ok&&s.ready===true&&Math.abs(Date.now()-s.serverTime)<10000){if(++stable>=3){console.log("Bot HTTP and persistent siege are healthy.");return;}}else stable=0;}catch{stable=0;}await new Promise(r=>setTimeout(r,2000));}throw Error("Bot failed to become healthy after restart");})().catch(e=>{console.error(e.message);process.exit(1);});'
        EOF
          # 255: ssh itself failed (no connection); any other failure is the deployment's own
          if [ "$status" -eq 0 ]; then break; fi
          if [ "$status" -ne 255 ] || [ "$attempt" -eq 3 ]; then exit "$status"; fi
          echo "Connexion SSH impossible (tentative $attempt), nouvel essai dans une minute..."
          sleep 60
        done

        echo "✅ Déploiement terminé avec succès !"
