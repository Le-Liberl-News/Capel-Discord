name: Sanktheim diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sanktheim-diagnostics.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read server health and siege progress
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sudo apt-get install -y sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd /home/twnkek290001/LN-Bot
          node <<'JS'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const apps=JSON.parse(execFileSync('pm2',['jlist'],{encoding:'utf8'}));
          for(const a of apps.filter(a=>a.name==='LN-Bot')){const e=a.pm2_env;console.log(JSON.stringify({name:a.name,pid:a.pid,status:e.status,restarts:e.restart_time,uptime:e.pm_uptime}));for(const p of [e.pm_err_log_path,e.pm_out_log_path]){if(!p||!fs.existsSync(p))continue;const lines=fs.readFileSync(p,'utf8').split('\n').slice(-120).filter(l=>/Error|MODULE|Syntax|Siège|Sanktheim|Activation|Annonces|heap|memory|listen|EADDR|ECONN|TypeError|ReferenceError|at /.test(l));console.log(lines.join('\n').replace(/(password|token|secret)\s*[:=]\s*\S+/gi,'$1=[redacted]'));}}
          const p='.runtime/sanktheim-live/state.json';if(fs.existsSync(p)){const s=JSON.parse(fs.readFileSync(p,'utf8'));console.log(JSON.stringify({at:s.at,started:s.started,stoppedAt:s.stoppedAt,wave:s.wave&&{id:s.wave.id,started:s.wave.started,ends:s.wave.ends},summaries:s.summaries?.slice(-2).map(x=>({at:x.at,wave:x.wave,participants:x.participants?.length})),outbox:s.outbox?.map(e=>({id:e.id,type:e.type,at:e.at})),enemies:s.enemies?.length}));}
          JS
          curl -s --max-time 15 http://127.0.0.1:3000/api/siege/status || true
          REMOTE
