name: Read server disk usage
on:
  push:
    branches: [codex/sanktheim-render-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read disk space, inodes and account quota
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sudo apt-get install -y sshpass >/dev/null
          timeout 180 sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          echo 'DISK SPACE'
          df -h / /tmp /home/twnkek290001
          echo 'INODES'
          df -i / /tmp /home/twnkek290001
          echo 'ACCOUNT QUOTA'
          timeout 10 quota -s 2>/dev/null || true
          echo 'BOT STORAGE'
          timeout 25 du -h --max-depth=1 /home/twnkek290001/LN-Bot 2>/dev/null | sort -h
          echo 'LOG AND CACHE STORAGE'
          timeout 20 du -sh /home/twnkek290001/.pm2/logs /home/twnkek290001/.cache /tmp/chromium* 2>/dev/null || true
          REMOTE
