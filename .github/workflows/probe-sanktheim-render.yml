name: Verify Sanktheim media
on:
  push:
    branches: [codex/sanktheim-render-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read attachment status on existing Discord alerts
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sudo apt-get install -y sshpass >/dev/null
          timeout 180 sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd /home/twnkek290001/LN-Bot
          node <<'JS'
          const fs=require('fs');require('dotenv').config({quiet:true});
          (async()=>{const s=JSON.parse(fs.readFileSync('.runtime/sanktheim-live/state.json','utf8')),l=JSON.parse(fs.readFileSync('.runtime/sanktheim-live/deliveries.json','utf8'));console.log('repair version',l.mediaRepairVersion,'pending images',Object.keys(l.mediaJobs??{}).length);for(const job of Object.values(l.mediaJobs??{}))console.log('image job',job.event.type,'attempts',job.attempts??0,'error',job.lastError??null);for(const e of s.events.filter(e=>['threshold','soldier-death','soldier-critical','tank-arrival'].includes(e.type)&&e.replay?.scene).slice(-3)){const id=l['Sanktheim · '+e.id+' · 0'];if(typeof id!=='string')continue;const r=await fetch('https://discord.com/api/v10/channels/'+process.env.ROLEPLAY_ID+'/messages/'+id,{headers:{Authorization:'Bot '+process.env.DISCORD_TOKEN}});if(!r.ok){console.log('message check failed',r.status);continue;}const m=await r.json();console.log('existing alert',e.type,'attachments',(m.attachments??[]).map(a=>({name:a.filename,bytes:a.size,width:a.width,height:a.height})),'embedded image',!!m.embeds?.[0]?.image);} })().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
          REMOTE
