name: Read server memory pressure
on:
  push:
    branches: [codex/sanktheim-render-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read memory limits and capture process usage
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sudo apt-get install -y sshpass >/dev/null
          timeout 180 sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          echo 'MEMORY AND LOAD'
          free -m
          uptime
          ps -u "$(id -u)" -o pid,ppid,comm,rss,%cpu --sort=-rss | head -20
          echo 'CGROUP MEMORY EVENTS'
          for file in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.failcnt /sys/fs/cgroup/memory/memory.limit_in_bytes; do
            if [ -r "$file" ]; then echo "$file"; cat "$file"; fi
          done
          REMOTE
