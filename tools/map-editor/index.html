<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier maps · Capel</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>Atelier maps</strong><select id="maps" aria-label="Map"></select><input id="name" aria-label="Nom du projet" placeholder="Nom du projet"><button id="save">Sauvegarder</button><button id="export">Exporter</button><button id="test">Tester en jeu</button><button id="apply">Appliquer localement</button><span id="dirty"></span></header>
<main><aside><h2>Assets natifs</h2><input id="filter" placeholder="Chercher un asset…"><div id="palette"></div><h2>Objets de la map</h2><input id="objects-filter" placeholder="Chercher un objet…"><div id="objects"></div></aside>
<section id="workspace"><nav><button data-mode="translate" class="active">Déplacer</button><button data-mode="rotate">Pivoter</button><button data-mode="scale">Échelle</button><button id="undo">↶</button><button id="redo">↷</button><button id="duplicate">Dupliquer</button><button id="delete">Supprimer</button><button id="focus">Centrer</button><button id="overview">Vue d’ensemble</button><label><input id="walls" type="checkbox" checked>Murs</label><label><input id="lighting" type="checkbox">Lumière du jeu</label></nav><div id="viewport"></div><div id="hint">Clic : sélectionner · Glisser : déplacer au sol · Clic droit : caméra · Molette : zoom</div></section>
<aside id="inspector"><h2>Objet sélectionné</h2><input id="object-name" aria-label="Nom de l’objet" disabled><label>Rôle <select id="role" disabled><option value="floor">Sol jouable</option><option value="wall">Mur / barrière</option><option value="obstacle">Obstacle</option><option value="decoration">Décor</option><option value="marker">Repère</option></select></label><div id="fields"></div><label><input id="uniform" type="checkbox" checked>Échelle uniforme</label><label><input id="snap" type="checkbox">Aimantation 0,25</label><p class="axes"><b>X</b> / <b>Y</b> : au sol · <b>Z</b> : hauteur</p><button id="cancel-placement" hidden>Annuler la pose</button><p id="source"></p></aside></main><footer><span id="status">Chargement…</span></footer><script type="module" src="bundle.js"></script></body></html>
