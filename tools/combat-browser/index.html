<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier combat · Sky</title><link rel="stylesheet" href="style.css"><body><header><h1>Atelier combat</h1><button id="spritesTab">Personnages</button><button id="effectsTab">Effets</button><button id="texturesTab">Textures</button><span id="count"></span><button id="export">Exporter les choix</button></header><main><aside><input id="search" placeholder="Rechercher" aria-label="Rechercher"><div id="list"></div></aside><section><h2 id="title"></h2><div id="spriteOptions"><label>Animation <select id="animation"></select></label><label>Direction <select id="direction"></select></label></div><div id="effectOptions" hidden><label>Personnage <select id="effectCharacter"></select></label><span id="atlasOptions"><label>Colonnes <input id="cols" type="number" min="1" max="64" value="1"></label><label>Lignes <input id="rows" type="number" min="1" max="64" value="1"></label><label>Première frame <input id="first" type="number" min="0" value="0"></label><label>Frames (0 = toutes) <input id="length" type="number" min="0" value="0"></label><label>Mélange <select id="blend"><option value="normal">Normal</option><option value="add">Additif</option></select></label></span><span id="cameraOptions"><label>Rotation <input id="yaw" type="range" min="-180" max="180" value="35"></label><label>Inclinaison <input id="pitch" type="range" min="0" max="80" value="30"></label></span></div><div class="stage"><canvas id="preview" width="960" height="540"></canvas></div><div class="controls"><button id="gif">Copier le GIF</button><button id="play">Pause</button><button id="previous">◀</button><button id="next">▶</button><input id="frame" aria-label="Frame" type="range" min="0" max="0" value="0"><span id="frameInfo"></span><label>Vitesse <input id="speed" type="number" value="1" min="0.1" max="4" step="0.1"></label><label>FPS <input id="fps" type="number" value="12" min="1" max="60"></label><label>Zoom <input id="zoom" type="number" value="2" min="0.25" max="6" step="0.25"></label><label>Fond <select id="background"><option value="check">Damier</option><option value="dark">Sombre</option><option value="light">Clair</option></select></label></div><code id="reference"></code><details><summary>Textures de l’effet</summary><img id="sheet" alt="Planche de sprites"><div id="effectSheets"></div></details><div class="choice"><label>Action <select id="kind"><option>Attaque</option><option>Art</option><option>Craft</option></select></label><label>Mécanique <input id="mechanic" placeholder="Projectile, soin, zone…"></label><label>Notes <textarea id="notes" placeholder="Dégâts, portée, effet, timing…"></textarea></label><button id="save">Ajouter aux choix</button><button id="copy">Copier la référence</button></div><div id="saved"></div><p id="status" role="status"></p></section></main><script type="module" src="app.js"></script></body></html>
