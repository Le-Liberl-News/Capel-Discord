<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Atelier cinématiques · Capel</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Atelier cinématiques</h1><input id="project" value="ray" aria-label="Nom du projet"><select id="projects" aria-label="Projets sauvegardés"></select><button id="load">Ouvrir</button><button id="save">Sauvegarder</button><button id="export">Exporter .sky</button><label class="button">Importer<input type="file" id="import" accept=".sky,.txt" hidden></label></header>
<main><aside><label>Map<select id="map" aria-label="Map"></select></label><h2>Personnages et ennemis</h2><select id="actor" aria-label="Acteur sélectionné"></select><div class="row"><input id="alias" placeholder="Nom dans le script" value="figurant" aria-label="Nom de l’acteur"><select id="kind" aria-label="Type"><option value="npc">PNJ</option><option value="enemy">Ennemi</option><option value="player">Joueur</option></select></div><input id="search" placeholder="Chercher un sprite" aria-label="Filtrer les sprites"><select id="sprite" aria-label="Sprite"></select><div class="row"><button id="add">Ajouter</button><button id="update">Modifier</button><button id="remove">Retirer</button></div>
<label>Outil<select id="tool" aria-label="Outil"><option value="select">Déplacer un personnage</option><option value="walk">Destination de marche</option><option value="curve">Trajet courbe (contrôle puis destination)</option><option value="camera">Cible de caméra</option></select></label><div class="row"><label>Durée (s)<input type="number" id="duration" value="3" min="0.1" step="0.1"></label><button id="face">Regarder le point</button></div><label>Orientation (0° = nord)<input id="angle" type="number" value="0" step="15"></label><div id="compass" class="row"><button data-angle="315">NO</button><button data-angle="0">N</button><button data-angle="45">NE</button><button data-angle="270">O</button><button data-angle="90">E</button><button data-angle="225">SO</button><button data-angle="180">S</button><button data-angle="135">SE</button></div><button id="turn">Appliquer l’orientation</button><label>Transition du plan<select id="transition"><option value="tween">Travelling</option><option value="cut">Coupe directe</option><option value="fade">Fondu noir</option></select></label><h2>Objets, effets et sons</h2><select id="assetKind"><option value="model">Objet 3D</option><option value="effect">Effet animé</option><option value="sound">Bruitage / musique</option></select><input id="assetSearch" placeholder="Chercher un asset"><select id="assetChoice"></select><input id="objectId" value="objet1" aria-label="Identifiant de l’objet"><div class="row"><label>Échelle<input id="assetScale" type="number" value="1" min="0.01" step="0.1"></label><label>Volume<input id="volume" type="number" value="0.7" min="0" max="1" step="0.1"></label></div><button id="listen">Écouter le son</button><button id="spawn">Insérer dans la séquence</button><button id="deleteObject">Retirer cet objet</button><button id="assetReport">Assets à publier</button><button id="package">Préparer le dossier</button><pre id="missingAssets"></pre><div id="coords">—</div><h2>Dialogue</h2><textarea id="line" aria-label="Réplique" rows="3" placeholder="Réplique"></textarea><button id="say">Ajouter la réplique</button><button id="wait">Ajouter une attente</button><h2>Séquence</h2><div id="timeline"></div></aside>
<section><nav><button id="play">Prévisualiser</button><button id="stop">Arrêter</button><button id="camera">Ajouter ce plan</button><button id="focus">Centrer</button><button id="overview">Vue d’ensemble</button><button id="undo" disabled>Annuler</button><button id="redo" disabled>Rétablir</button><label>Temps<input type="range" id="time" min="0" max="60" value="0" step="0.1"></label><output id="clock">0 s</output></nav><iframe id="view" src="preview.html" title="Map et prévisualisation"></iframe><p class="hint">Glisser un personnage ou un point du trajet · Clic droit : tourner · Maj + clic droit : déplacer la vue · Molette : zoom</p><label class="script-label">Script<textarea id="script" spellcheck="false" aria-label="Script de la cinématique"></textarea></label></section></main><footer id="status" role="status">Chargement…</footer><script type="module" src="app.mjs"></script></body></html>
